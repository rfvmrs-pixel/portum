<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portum - Sistema Integrado de Gestão portuária. Demonstração com dados fictícios e mapa de navios com AIS ao vivo.">
<link rel="icon" type="image/svg+xml" href="marca/portum-simbolo.svg">
<style>body{margin:0}</style>
<title>Portum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de módulos (vira faixa rolável no celular) + área de trabalho com resumo no topo e detalhe abaixo */
:root{
  --mar:#0C2748; --agua:#15808F; --agua-2:#2EC7C0; --grad:linear-gradient(135deg,#1C5F92 0%,#1FA0AC 55%,#4FD9CB 100%); --faixa:linear-gradient(120deg,#0C2748 0%,#0F325C 60%,#134575 100%); --boia:#E09422; --boia-forte:#B8730C;
  --bg:#F3F6F8; --sup:#FFFFFF; --sup-2:#EAF0F3; --linha:#D5DEE4; --tx:#0F2233; --tx-2:#4A6072; --tx-3:#7890A0;
  --ok:#1E8A55; --ok-bg:#E2F4EA; --at:#B7791F; --at-bg:#FBF0DC; --cr:#C2413A; --cr-bg:#FBE5E3; --info-bg:#E1F1F1;
  --lateral:#0C2748; --lateral-tx:#C9D7E2; --lateral-ativo:#17406E;
  --f-disp:'Montserrat','Segoe UI',Arial,sans-serif;
  --f-tx:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1620; --sup:#10212E; --sup-2:#16293A; --linha:#22394B; --tx:#E4EDF3; --tx-2:#A3B7C6; --tx-3:#7690A3;
  --agua:#3CB5B5; --agua-2:#4CC9C9; --boia:#F2A93B; --boia-forte:#F2A93B;
  --ok:#4CC38A; --ok-bg:#12352A; --at:#E8B04F; --at-bg:#3A2D12; --cr:#F07A72; --cr-bg:#3D1C1B; --info-bg:#123236;
  --lateral:#071019; --lateral-tx:#A9BDCC; --lateral-ativo:#14304A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1620; --sup:#10212E; --sup-2:#16293A; --linha:#22394B; --tx:#E4EDF3; --tx-2:#A3B7C6; --tx-3:#7690A3;
  --agua:#3CB5B5; --agua-2:#4CC9C9; --boia:#F2A93B; --boia-forte:#F2A93B;
  --ok:#4CC38A; --ok-bg:#12352A; --at:#E8B04F; --at-bg:#3A2D12; --cr:#F07A72; --cr-bg:#3D1C1B; --info-bg:#123236;
  --lateral:#071019; --lateral-tx:#A9BDCC; --lateral-ativo:#14304A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--f-tx);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lateral)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
aside{background:linear-gradient(180deg,#0C2748 0%,#0A1E3A 100%);color:var(--lateral-tx);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.marca{display:flex;align-items:center;gap:10px;padding:2px 6px}
.marca svg{width:48px;height:48px;flex:none}
.marca b{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:.6px;color:#fff;line-height:1;display:block}
.marca small{display:block;font-family:var(--f-disp);font-size:7.6px;font-weight:700;letter-spacing:.7px;color:#fff;text-transform:uppercase;margin-top:4px;white-space:nowrap}
.porto{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;font-size:12px}
.porto b{display:block;color:#fff;font-weight:600;font-size:13px}
nav{display:flex;flex-direction:column;gap:2px}
nav .grupo{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#6E8BA2;padding:10px 10px 4px}
nav a{display:flex;align-items:center;gap:10px;color:var(--lateral-tx);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:13.5px}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a[aria-current="page"]{background:var(--lateral-ativo);color:#fff;box-shadow:inset 3px 0 0 #4FD9CB}
nav a svg{width:17px;height:17px;flex:none;opacity:.85}
nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--boia);outline-offset:2px}
.rodape-lat{margin-top:auto;font-size:11px;color:#6E8BA2;padding:0 8px}
main{min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.aviso{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--info-bg);border:1px solid var(--linha);border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--tx-2)}
.aviso b{color:var(--tx)}
.faixa{background:var(--faixa);border-radius:16px;padding:22px 24px;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.faixa svg{width:86px;height:86px;flex:none}
.faixa .nm{font-family:var(--f-disp);font-weight:800;font-size:42px;line-height:1;letter-spacing:.5px}
.faixa .tg{font-family:var(--f-disp);font-weight:700;font-size:12.5px;letter-spacing:1.1px;margin-top:7px;text-transform:uppercase}
.faixa p{margin:0;flex-basis:100%;font-size:14.5px;color:#C4D3E2;line-height:1.45}
.faixa p b{color:#fff;font-weight:600}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.cab h1{font-family:var(--f-disp);font-weight:800;font-size:27px;letter-spacing:-.2px;margin:0;line-height:1.05;text-wrap:balance}
.cab p{margin:4px 0 0;color:var(--tx-2);max-width:68ch}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--agua);font-weight:600}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--sup);border:1px solid var(--linha);border-radius:8px;padding:6px 10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--linha);background:var(--sup);color:var(--tx);padding:6px 12px}
button.prim{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--mar);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--tx-2)}
.kpi b{font-family:var(--f-disp);font-size:25px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b small{font-family:var(--f-tx);font-size:13px;font-weight:500;color:var(--tx-2);margin-left:3px}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)} .down{color:var(--cr)} .neu{color:var(--tx-3)}
.grade{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.painel{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.painel h2{font-family:var(--f-disp);font-size:15.5px;font-weight:700;margin:0;letter-spacing:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.painel h2 small{font-family:var(--f-tx);font-size:12px;font-weight:400;color:var(--tx-3);letter-spacing:0}
.tab{overflow-x:auto;border:1px solid var(--linha);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--tx-2);background:var(--sup-2);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--linha);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--sup-2)}
tr.sel td{background:var(--info-bg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:var(--ok-bg)} .at{color:var(--at);background:var(--at-bg)} .cr{color:var(--cr);background:var(--cr-bg)} .in{color:var(--agua);background:var(--info-bg)} .ne{color:var(--tx-2);background:var(--sup-2)}
.barra{height:8px;border-radius:99px;background:var(--sup-2);overflow:hidden;min-width:70px}
.barra i{display:block;height:100%;border-radius:99px;background:var(--agua)}
.barra i.b{background:var(--boia)} .barra i.r{background:var(--cr)}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--tx-3)}
svg.graf{width:100%;height:auto;display:block}
svg.graf text{fill:var(--tx-3);font-family:var(--f-tx);font-size:11px}
svg.graf .grade-l{stroke:var(--linha);stroke-width:1}
svg.graf .s1{fill:var(--agua)} svg.graf .s2{fill:var(--boia)} svg.graf .s3{fill:var(--tx-3);opacity:.35}
svg.graf .l1{stroke:var(--agua);fill:none;stroke-width:2.2} svg.graf .l2{stroke:var(--boia);fill:none;stroke-width:2;stroke-dasharray:5 4}
svg.graf .a1{fill:var(--agua);opacity:.14}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--tx-2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pilar{border:1px solid var(--linha);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--sup)}
.pilar:hover{border-color:var(--agua)}
.pilar b{font-size:13.5px} .pilar p{margin:0;font-size:12.5px;color:var(--tx-2)}
.lista{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lista li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--linha);padding-bottom:8px}
.lista li:last-child{border-bottom:0;padding-bottom:0}
.lista .q{font-size:12px;color:var(--tx-3)}
.patios{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.baia{border-radius:9px;padding:9px 10px;border:1px solid var(--linha);background:var(--sup-2);display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.baia b{font-size:12.5px} .baia span{font-size:11.5px;color:var(--tx-2)}
.baia[aria-pressed="true"]{outline:2px solid var(--agua)}
.detalhe{background:var(--sup-2);border-radius:10px;padding:12px 14px;font-size:13px}
.linha-tempo{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.linha-tempo li{display:grid;grid-template-columns:52px 14px 1fr;gap:8px;align-items:start;font-size:13px}
.linha-tempo li i{width:10px;height:10px;border-radius:50%;background:var(--agua);margin-top:5px;position:relative}
.linha-tempo li:not(:last-child) i::after{content:"";position:absolute;left:4px;top:11px;width:2px;height:24px;background:var(--linha)}
.linha-tempo li span{font-family:var(--f-num);color:var(--tx-2);font-size:12px;padding-top:1px}
.linha-tempo li p{margin:0 0 12px}
.config{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.config label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--tx-2)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--linha);border-radius:8px;padding:5px 10px;color:var(--tx);background:var(--sup)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--mar);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mapa-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
#mapaNavios{height:600px;border-radius:12px;border:2px solid #0C2748;background:#0C2748;z-index:0}
.leaflet-tooltip.nv-rot{background:transparent;border:0;box-shadow:none;color:#fff;font-family:var(--f-disp);font-weight:700;font-size:11px;letter-spacing:.2px;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;padding:0;white-space:nowrap}
.leaflet-tooltip.nv-rot::before{display:none}
.leaflet-tooltip.nv-rot.mov{color:#5FE6D4}
.mapa-topo{position:absolute;z-index:500;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.mapa-topo .pilula{background:rgba(12,39,72,.88);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mapa-topo button.pilula{cursor:pointer}
.mapa-topo button.pilula[aria-pressed="true"]{background:#1FA0AC;border-color:#1FA0AC}
.mapa-leg{position:absolute;z-index:500;left:12px;bottom:26px;background:rgba(12,39,72,.88);color:#fff;border-radius:10px;padding:8px 11px;font-size:11.5px;display:flex;flex-direction:column;gap:4px}
.mapa-leg i{display:inline-block;width:18px;height:7px;border-radius:2px 7px 7px 2px;margin-right:6px;vertical-align:1px}
.mapa-caixa{position:relative}
.busca{position:relative;flex:1 1 320px;max-width:520px}
.busca input{width:100%;padding:9px 12px 9px 36px;font-size:14px}
.busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--tx-3)}
.sugestoes{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sup);border:1px solid var(--linha);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:1000;max-height:300px;overflow-y:auto}
.sugestoes button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-radius:0;padding:8px 12px;background:transparent}
.sugestoes button:hover,.sugestoes button:focus-visible{background:var(--sup-2)}
.sugestoes small{color:var(--tx-3)}
.lista-navios{display:flex;flex-direction:column;gap:0;max-height:470px;overflow-y:auto;margin:0;padding:0;list-style:none}
.lista-navios li{padding:8px 4px;border-bottom:1px solid var(--linha);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lista-navios li:hover{background:var(--sup-2)}
.lista-navios .q{font-size:11.5px;color:var(--tx-3)}
.mt-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--agua);text-decoration:none;font-weight:600}
.mt-link:hover{text-decoration:underline}
.leaflet-popup-content{font-family:var(--f-tx);font-size:12.5px;line-height:1.45}
.leaflet-popup-content b{font-size:13.5px}
.nv-ic{background:transparent;border:0}
@media (max-width:1000px){.mapa-wrap{grid-template-columns:minmax(0,1fr)} #mapaNavios{height:420px} .c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;height:auto;flex-direction:column;gap:10px;padding-block:10px;padding-right:max(14px,env(safe-area-inset-right,0px));z-index:5}
  .porto,.rodape-lat,nav .grupo{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav a{white-space:nowrap;padding:6px 10px}
  .cab h1{font-size:22px} .faixa .nm{font-size:30px} .faixa svg{width:64px;height:64px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside>
    <div class="marca" id="marca"></div>
    <div class="porto"><span>Ambiente de demonstração</span><b id="nomePorto">Terminal Baía Serena</b><span id="descPorto">Porto fictício · 4 berços</span></div>
    <nav id="nav" aria-label="Módulos"></nav>
    <div class="rodape-lat">Portum · demo v4 · mapa com AIS ao vivo</div>
  </aside>
  <main><div class="wrap" id="tela"></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const fmt = (v, d = 0) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const ls = { get(k, d){ try { const v = localStorage.getItem('portum.' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem('portum.' + k, JSON.stringify(v)); } catch(e){} } };
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
const logo = id => `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A7DB8"/><stop offset=".55" stop-color="#22A9B0"/><stop offset="1" stop-color="#5FE6D4"/></linearGradient></defs><path fill="url(#${id})" fill-rule="evenodd" d="M8 16H30a13 13 0 0 1 0 26H20V56H8ZM20 26V32H29a3 3 0 0 0 0-6Z"/><path fill="url(#${id})" opacity=".85" d="M24 47C35 47 39 39 56 39V48C44 48 40 57 24 57Z"/><g fill="none" stroke="#8DEFE2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16V9L50 5M14 9L26 16M50 5V13"/></g><rect x="44.5" y="13" width="11" height="7" rx="1" fill="#8DEFE2"/></svg>`;
const chip = (txt, cls) => `<span class="chip ${cls}">${esc(txt)}</span>`;
const barra = (pct, cls = '') => `<div class="barra" title="${fmt(pct)}%"><i class="${cls}" style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const kpi = (rot, val, un, delta, dcls) => `<div class="kpi"><span>${rot}</span><b>${val}${un ? `<small>${un}</small>` : ''}</b>${delta ? `<em class="${dcls || 'neu'}">${delta}</em>` : ''}</div>`;
function tabela(cols, linhas, opts = {}){
  return `<div class="tab"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>${
    linhas.map((l, i) => `<tr${opts.clic ? ` class="clic" data-i="${i}" tabindex="0"` : ''}>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f ? c.f(l) : esc(l[c.k])}</td>`).join('')}</tr>`).join('')
  }</tbody></table></div>`;
}
// gráfico de barras (séries empilhadas ou lado a lado) + linha opcional
function grafBarras({ rotulos, series, linha, altura = 200, empilhar = false, unidade = '' }){
  const W = 640, H = altura, pl = 46, pr = 10, pt = 12, pb = 26;
  const somas = rotulos.map((_, i) => empilhar ? series.reduce((s, se) => s + se.v[i], 0) : Math.max(...series.map(se => se.v[i])));
  const max = Math.max(...somas, ...(linha ? linha.v : [0])) * 1.12 || 1;
  const passo = Math.pow(10, Math.floor(Math.log10(max))); const tick = [1, 2, 2.5, 5, 10].map(m => m * passo).find(t => max / t <= 5);
  const y = v => pt + (H - pt - pb) * (1 - v / max);

}

    <label for="cMeta">Meta diária de movimentação (t)<input type="number" id="cMeta" min="1000" step="500" value="${CFG.metaDia}"></label>
    <label for="cTurnos">Regime de turnos<select id="cTurnos"><option value="2x12" ${CFG.turnos === '2x12' ? 'selected' : ''}>2 turnos de 12 h</option><option value="3x8" ${CFG.turnos === '3x8' ? 'selected' : ''}>3 turnos de 8 h</option></select></label>
    <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:12.5px">Cargas operadas</span><div class="checks">${Object.entries(CARGAS).map(([k, v]) => `<label><input type="checkbox" name="carga" value="${k}" ${CFG.cargas.includes(k) ? 'checked' : ''}>${v}</label>`).join('')}</div></div>
    <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px"><span class="muted" style="font-size:12.5px">Modais</span><div class="checks"><label><input type="checkbox" name="modal" value="rodo" ${CFG.modal.includes('rodo') ? 'checked' : ''}>Rodoviário</label><label><input type="checkbox" name="modal" value="ferro" ${CFG.modal.includes('ferro') ? 'checked' : ''}>Ferroviário</label></div></div>
    <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap"><button class="prim" type="submit">Aplicar ao demo</button><button type="button" id="cPadrao">Voltar ao padrão</button></div>
  </form></section>
  <div class="grade"><section class="painel c6"><h2>O que se adapta</h2><ul class="lista">
    <li><span>Berços, calados e cabeços do cais</span>${chip('Cadastro', 'in')}</li><li><span>Tipos de carga, unidades e tolerância NF × balança</span>${chip('Cadastro', 'in')}</li><li><span>Turnos, escalas e regras de hora extra</span>${chip('Cadastro', 'in')}</li><li><span>Balanças, gate, ERP, ponto e sistema portuário</span>${chip('Integração', 'at')}</li><li><span>Marca do cliente nos relatórios e no portal do cliente</span>${chip('Cadastro', 'in')}</li></ul></section>
  <section class="painel c6"><h2>Implantação em etapas</h2><ol class="linha-tempo">${[['Sem. 1–2', 'Diagnóstico: fluxos, sistemas existentes e indicadores que a diretoria acompanha'], ['Sem. 3–4', 'Cadastro do porto e primeiros módulos com planilhas e exportações atuais'], ['Sem. 5–8', 'Integrações com balança, gate e sistema portuário; treinamento das equipes'], ['Sem. 9+', 'Painel executivo, relatórios ao cliente e melhorias contínuas']].map(e => `<li><span>${e[0]}</span><i></i><p>${e[1]}</p></li>`).join('')}</ol></section></div>`;

// ---------- roteamento e eventos ----------
function render(){
  const id = (location.hash || '#inicio').slice(1); const m = MODULOS.find(x => x.id === id) ? id : 'inicio';
  if (MAPA && m !== 'mapa') { MAPA.remove(); MAPA = null; clearInterval(window.__autoNavios); }
  montarNav(m); $('#tela').innerHTML = V[m](); ls.set('ultima', m);
  if (m === 'mapa') iniciarMapa();
}
document.addEventListener('change', e => { if (e.target.id === 'fRec'){ ls.set('fRec', e.target.value); render(); } });
document.addEventListener('click', e => {
  const tr = e.target.closest('tr.clic'); if (tr && location.hash === '#carretas'){ ls.set('selCar', +tr.dataset.i); render(); return; }
  const b = e.target.closest('[data-baia]'); if (b){ ls.set('selBaia', +b.dataset.baia); render(); return; }
  if (e.target.id === 'cPadrao'){ CFG = Object.assign({}, PADRAO); ls.set('cfg', CFG); gerar(); render(); toast('Configuração padrão restaurada'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter'){ const tr = e.target.closest && e.target.closest('tr.clic'); if (tr) tr.click(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'fCfg') return; e.preventDefault();
  const cargas = [...document.querySelectorAll('input[name=carga]:checked')].map(i => i.value);
  const modal = [...document.querySelectorAll('input[name=modal]:checked')].map(i => i.value);
  CFG = { nome: $('#cNome').value.trim() || PADRAO.nome, cidade: $('#cCidade').value.trim() || PADRAO.cidade, bercos: Math.max(1, Math.min(6, +$('#cBercos').value || 4)), turnos: $('#cTurnos').value, metaDia: Math.max(1000, +$('#cMeta').value || 18000), cargas: cargas.length ? cargas : ['gusa'], modal: modal.length ? modal : ['rodo'] };
  ls.set('cfg', CFG); gerar(); render(); toast('Demo ajustado para ' + CFG.nome);
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
gerar();
if (!location.hash){ const u = ls.get('ultima', 'inicio'); if (u !== 'inicio') history.replaceState(null, '', '#' + u); }
render();
})();
</script>

</body>
</html>
